<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiyen Mart - Online Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">Jiyen<span>Mart</span></div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#products">Products</a></li>
      <li><a href="#about">About</a></li>
    </ul>
    <div class="cart-btn">
      🛒 Cart (<span id="cart-count">0</span>)
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero" id="home">
    <h1>Welcome to Jiyen Mart</h1>
    <p>Discover best quality products at affordable prices.</p>
    <a href="#products" class="btn">Shop Now</a>
  </header>

  <!-- Products Section -->
  <section class="products-section" id="products">
    <h2>Featured Products</h2>
    <div class="product-grid">

      <!-- Product 1 -->
      <div class="product-card">
        <img src="https://picsum.photos/300/200?random=1" alt="Product 1">
        <h3>Smart Watch</h3>
        <p class="price">$49.99</p>
        <button class="add-to-cart" onclick="addToCart()">Add to Cart</button>
      </div>

      <!-- Product 2 -->
      <div class="product-card">
        <img src="https://picsum.photos/300/200?random=2" alt="Product 2">
        <h3>Wireless Headphones</h3>
        <p class="price">$29.99</p>
        <button class="add-to-cart" onclick="addToCart()">Add to Cart</button>
      </div>

      <!-- Product 3 -->
      <div class="product-card">
        <img src="https://picsum.photos/300/200?random=3" alt="Product 3">
        <h3>Trendy Backpack</h3>
        <p class="price">$39.99</p>
        <button class="add-to-cart" onclick="addToCart()">Add to Cart</button>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Jiyen Mart. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
